name: Deploy site

on:
  push:
    branches: [main]
  # Commits made by the tracker use GITHUB_TOKEN, which doesn't trigger `push` workflows.
  # Listening for the tracker's completion is what keeps the live site in sync.
  workflow_run:
    workflows: ["Track transfer bonuses"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}   # include the tracker's latest commit

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest assets data _site/
          # Pages serves everything with max-age=600. Versioned URLs make each deploy's
          # HTML fetch matching JS/CSS instead of a cached copy from the previous deploy.
          sed -i -E "s#\"(assets/(app|advice)\.js|assets/styles\.css)\"#\"\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -q "app.js?v=" _site/index.html

      # Museum Reciprocal Finder lives in its own public repo and is published here
      # at /museum_problem/. It's fetched fresh on every deploy (this workflow runs
      # after each tracker run), so its monthly data refreshes show up within hours.
      - name: Add museum finder at /museum_problem/
        run: |
          git clone --depth 1 https://github.com/rg-code/museum-reciprocal-finder.git "$RUNNER_TEMP/museum"
          mkdir -p _site/museum_problem
          cp "$RUNNER_TEMP"/museum/{index.html,manifest.webmanifest,sw.js} _site/museum_problem/
          cp -r "$RUNNER_TEMP/museum/data" _site/museum_problem/data
          cp -r "$RUNNER_TEMP/museum/icons" _site/museum_problem/icons
          test -s _site/museum_problem/data/museums.json
          test -s _site/museum_problem/icons/icon-512.png   # the install prompt needs 192/512 icons

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
