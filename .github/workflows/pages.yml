name: Deploy site

on:
  push:
    branches: [main]
  # Commits made by the tracker use GITHUB_TOKEN, which doesn't trigger `push` workflows.
  # Listening for the tracker's completion is what keeps the live site in sync.
  workflow_run:
    workflows: ["Track transfer bonuses"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}   # include the tracker's latest commit

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html 404.html manifest.webmanifest robots.txt sitemap.xml assets data _site/
          test -s _site/robots.txt && test -s _site/sitemap.xml && test -s _site/404.html   # 404.html also covers /museum_problem/
          # The art gallery problem, the reason the museum finder is "museum_problem".
          for d in art-gallery-problem art_gallery_problem Art-gallery-problem Art_gallery_problem; do
            mkdir -p _site/$d && cp art-gallery-problem/index.html _site/$d/
          done
          # Pages serves everything with max-age=600. Versioned URLs make each deploy's
          # HTML fetch matching JS/CSS instead of a cached copy from the previous deploy.
          sed -i -E "s#\"(assets/(app|advice)\.js|assets/styles\.css)\"#\"\1?v=${GITHUB_SHA::7}\"#g" _site/index.html
          grep -q "app.js?v=" _site/index.html

      # Museum Reciprocal Finder lives in its own repo (private once MUSEUM_DEPLOY_KEY,
      # a read-only deploy key on that repo, is set here) and is published at
      # /museum_problem/. It's fetched fresh on every deploy (this workflow runs after
      # each tracker run), so its monthly data refreshes show up within hours.
      - uses: actions/checkout@v5
        with:
          repository: rg-code/museum-reciprocal-finder
          path: _museum
          ssh-key: ${{ secrets.MUSEUM_DEPLOY_KEY }}   # empty while the repo is public: falls back to github.token
          persist-credentials: false

      # Museums, networks and membership prices ship packed (gzip + AES-GCM, key in
      # the page) so scrapers don't get plain JSON; the app unpacks them in the browser.
      - name: Add museum finder at /museum_problem/
        run: |
          M=_museum S=_site/museum_problem
          mkdir -p $S/data
          cp $M/{index.html,manifest.webmanifest,sw.js} $S/
          cp -r $M/icons $M/fonts $S/
          cp $M/data/{zip_centroids,places}.json $S/data/   # Census geography, public anyway
          node $M/tools/pack-data.mjs $S/data
          for f in museums programs memberships; do test -s $S/data/$f.bin; done
          test ! -e $S/data/museums.json && test ! -e $S/data/memberships.seed.json
          test -s $S/icons/icon-512.png   # the install prompt needs 192/512 icons
          test -s $S/fonts/fraunces-600.woff2

      # Inkling (inKind restaurants by zip: what joined, what left) lives in the private
      # rg-code/RInkU repo, read with INKLING_DEPLOY_KEY (a read-only deploy key there), and
      # is published at /inkling/. Its data updates daily; it's fetched fresh on every deploy.
      - uses: actions/checkout@v5
        with:
          repository: rg-code/RInkU
          path: _inkling
          ssh-key: ${{ secrets.INKLING_DEPLOY_KEY }}
          persist-credentials: false
          sparse-checkout: site

      - name: Add Inkling at /inkling/
        run: |
          S=_site/inkling
          cp -r _inkling/site $S
          rm -f $S/404.html   # this site's 404.html covers /inkling/ too
          # Same reason as above: versioned URLs, so each deploy's HTML gets matching JS/CSS,
          # including the modules app.js imports.
          V=$(git -C _inkling rev-parse --short=7 HEAD)
          sed -i -E "s#(src|href)=\"(app\.js|style\.css)\"#\1=\"\2?v=$V\"#g" $S/index.html
          sed -i -E "s#'\./(config|lib|icons|map)\.js'#'./\1.js?v=$V'#g" $S/*.js
          grep -q "app.js?v=$V" $S/index.html && grep -q "lib.js?v=$V" $S/app.js
          # Installable app: name its offline cache after the commit, so each deploy starts fresh.
          sed -i "s/const CACHE = 'inkling-dev';/const CACHE = 'inkling-$V';/" $S/sw.js
          grep -q "inkling-$V" $S/sw.js
          test -s $S/manifest.webmanifest && test -s $S/icons/icon-512.png && test -s $S/icons/maskable-512.png
          for f in restaurants removed zips meta; do test -s $S/data/$f.json; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
