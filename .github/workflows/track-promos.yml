name: Track transfer bonuses

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours, off the top of the hour to dodge queue spikes
  workflow_dispatch:

permissions:
  contents: write   # commit data/promotions.json
  issues: write     # open an issue when a new bonus appears

concurrency:
  group: track-promos
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test parser and data
        run: npm test

      - name: Check blog feeds
        id: track
        run: node scripts/track-promos.mjs

      - name: Commit updated bonuses
        run: |
          if git diff --quiet -- data/promotions.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/promotions.json
          git commit -m "Update transfer bonuses"
          git push

      # Posts as Rohit via a Slack user token (scope chat:write). Runs after the commit so a failed
      # push means the next run finds the bonus again, rather than posting it twice.
      - name: Post new bonuses to Slack
        if: steps.track.outputs.new_count != '' && steps.track.outputs.new_count != '0'
        continue-on-error: true   # a Slack problem must not fail the run, or the site won't redeploy
        env:
          SLACK_USER_TOKEN: ${{ secrets.SLACK_USER_TOKEN }}
          SLACK_CHANNEL: ${{ vars.SLACK_CHANNEL_ID }}
        run: |
          [ -n "$SLACK_USER_TOKEN" ] && [ -n "$SLACK_CHANNEL" ] || { echo "Slack not configured, skipping."; exit 0; }
          jq --arg ch "$SLACK_CHANNEL" '. + {channel: $ch}' "$RUNNER_TEMP/new-promos.slack.json" > "$RUNNER_TEMP/slack.json"
          resp=$(curl -sS https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_USER_TOKEN" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data @"$RUNNER_TEMP/slack.json")
          # Slack answers HTTP 200 even on errors; the "ok" field says whether it posted.
          echo "$resp" | jq -e .ok > /dev/null || { echo "::warning::Slack post failed: $(echo "$resp" | jq -r .error)"; exit 1; }

      - name: Open an issue for new bonuses
        if: steps.track.outputs.new_count != '' && steps.track.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          COUNT: ${{ steps.track.outputs.new_count }}
        run: |
          gh label create transfer-bonus --color F2B705 --description "Found by the bonus tracker" --force
          gh issue create \
            --title "New transfer bonus found ($COUNT)" \
            --body-file "$RUNNER_TEMP/new-promos.md" \
            --label transfer-bonus
