name: Email a map update

# Manual: email every alert subscriber about a change on the transfer map (a new partner, a ratio
# change), through Inkling's Worker like the daily digest. Dry run is on by default and only prints
# the email in the log; untick it to send. It shares the list's daily email budget with the digest.
on:
  workflow_dispatch:
    inputs:
      subject:
        description: Subject line
        required: true
      message:
        description: Message (blank line between paragraphs)
        required: true
      dry_run:
        description: Only print the email, don't send it
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Send (or print) the update
        env:
          XFER_ALERTS_TOKEN: ${{ secrets.XFER_ALERTS_TOKEN }}
          MAIL_POSTAL_ADDRESS: ${{ vars.MAIL_POSTAL_ADDRESS }}
          SUBJECT: ${{ inputs.subject }}
          MESSAGE: ${{ inputs.message }}
        run: node scripts/send-alert.mjs --subject "$SUBJECT" --message "$MESSAGE" ${{ inputs.dry_run && '--dry-run' || '' }}
